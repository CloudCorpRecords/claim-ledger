name: Index claim ledger

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node indexer/index.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit ledger changes
        run: |
          git config user.name "claim-ledger-bot"
          git config user.email "claim-ledger-bot@users.noreply.github.com"
          git add docs/v1
          if git diff --cached --quiet; then
            echo "no ledger changes"
          else
            git commit -m "ledger: rebuild claim index"
            git push
          fi
